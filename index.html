<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Puantaj Uygulaması</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #12161c; color: #eef0f3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const C = { bg: "#12161c", surface: "#1a2029", surface2: "#212836", surface3: "#262f3e", border: "#2b3341", text: "#eef0f3", dim: "#8992a3", accent: "#f5a623" };
    const WEEKDAYS = ["Pzt", "Sal", "Çrş", "Prş", "Cum", "Cmt", "Paz"];
    const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    const pad2 = (n) => String(n).padStart(2, "0");
    const dateKey = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const todayKey = () => { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); };

    function App() {
      const [tab, setTab] = useState("calendar");
      const [cursor, setCursor] = useState(() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; });
      const [entries, setEntries] = useState(() => {
        try { return JSON.parse(localStorage.getItem("yevmiye:entries")) || {}; } catch (e) { return {}; }
      });
      const [dailyWage, setDailyWage] = useState(() => {
        try { return Number(localStorage.getItem("yevmiye:wage")) || 1000; } catch (e) { return 1000; }
      });
      const [selectedKey, setSelectedKey] = useState(null);

      const changeMonth = (d) => setCursor((c) => { let m = c.m + d, y = c.y; if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; } return { y, m }; });

      const grid = useMemo(() => {
        const firstDay = new Date(cursor.y, cursor.m, 1);
        let startOffset = firstDay.getDay() - 1; if (startOffset < 0) startOffset = 6;
        const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) cells.push(d);
        while (cells.length % 7 !== 0) cells.push(null);
        return cells;
      }, [cursor]);

      const workedDays = useMemo(() => {
        const prefix = `${cursor.y}-${pad2(cursor.m + 1)}-`;
        return Object.keys(entries).filter(k => k.startsWith(prefix) && entries[k]).length;
      }, [entries, cursor]);

      const toggleDay = (key) => {
        const next = { ...entries, [key]: !entries[key] };
        setEntries(next);
        localStorage.setItem("yevmiye:entries", JSON.stringify(next));
      };

      const handleWageChange = (val) => {
        setDailyWage(val);
        localStorage.setItem("yevmiye:wage", val);
      };

      const tKey = todayKey();

      return (
        <div style={{ background: C.bg, color: C.text, minHeight: "100vh", display: "flex", flexDirection: "column" }}>
          <div style={{ flex: 1, padding: 16, paddingBottom: 80 }}>
            {tab === "calendar" && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                  <button onClick={() => changeMonth(-1)} style={{ background: C.surface2, border: "none", color: C.text, padding: "8px 16px", borderRadius: 8, cursor: "pointer" }}>❮</button>
                  <div style={{ fontWeight: 700, fontSize: 18 }}>{MONTHS[cursor.m]} {cursor.y}</div>
                  <button onClick={() => changeMonth(1)} style={{ background: C.surface2, border: "none", color: C.text, padding: "8px 16px", borderRadius: 8, cursor: "pointer" }}>❯</button>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6 }}>
                  {WEEKDAYS.map(w => <div key={w} style={{ textAlign: "center", fontSize: 12, color: C.dim, paddingBottom: 6 }}>{w}</div>)}
                  {grid.map((d, i) => {
                    if (!d) return <div key={i} />;
                    const k = dateKey(cursor.y, cursor.m, d);
                    const isWorked = entries[k];
                    return (
                      <button key={i} onClick={() => toggleDay(k)} style={{
                        aspectRatio: "1", background: isWorked ? C.accent : C.surface2,
                        color: isWorked ? "#12161c" : C.text,
                        border: k === tKey ? `2px solid ${C.accent}` : `1px solid ${C.border}`,
                        borderRadius: 10, fontWeight: isWorked ? "700" : "400", cursor: "pointer"
                      }}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {tab === "summary" && (
              <div>
                <h2 style={{ marginBottom: 16 }}>{MONTHS[cursor.m]} {cursor.y} Özet</h2>
                <div style={{ background: C.surface, padding: 16, borderRadius: 12, marginBottom: 12, border: `1px solid ${C.border}` }}>
                  <div style={{ color: C.dim, fontSize: 14 }}>Çalışılan Gün</div>
                  <div style={{ fontSize: 24, fontWeight: 700, marginTop: 4 }}>{workedDays} Gün</div>
                </div>
                <div style={{ background: C.surface, padding: 16, borderRadius: 12, border: `1px solid ${C.border}` }}>
                  <div style={{ color: C.dim, fontSize: 14 }}>Hak Edilen Toplam Tutar</div>
                  <div style={{ fontSize: 28, fontWeight: 700, color: C.accent, marginTop: 4 }}>{(workedDays * dailyWage).toLocaleString("tr-TR")} ₺</div>
                </div>
              </div>
            )}

            {tab === "settings" && (
              <div>
                <h2 style={{ marginBottom: 16 }}>Ayarlar</h2>
                <div style={{ background: C.surface, padding: 16, borderRadius: 12, border: `1px solid ${C.border}` }}>
                  <label style={{ display: "block", marginBottom: 8, color: C.dim }}>Günlük Yevmiye (₺)</label>
                  <input type="number" value={dailyWage} onChange={(e) => handleWageChange(Number(e.target.value))} style={{
                    width: "100%", padding: 12, borderRadius: 8, background: C.surface2, color: C.text, border: `1px solid ${C.border}`, fontSize: 16
                  }} />
                </div>
              </div>
            )}
          </div>

          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, borderTop: `1px solid ${C.border}`, background: C.surface, display: "flex" }}>
            <button onClick={() => setTab("calendar")} style={{ flex: 1, background: "none", border: "none", padding: "14px 0", color: tab === "calendar" ? C.accent : C.dim, fontWeight: 700 }}>Takvim</button>
            <button onClick={() => setTab("summary")} style={{ flex: 1, background: "none", border: "none", padding: "14px 0", color: tab === "summary" ? C.accent : C.dim, fontWeight: 700 }}>Özet</button>
            <button onClick={() => setTab("settings")} style={{ flex: 1, background: "none", border: "none", padding: "14px 0", color: tab === "settings" ? C.accent : C.dim, fontWeight: 700 }}>Ayarlar</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
